package routybor.otp.Messenger;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.io.PrintWriter;
import java.math.BigInteger;
import java.net.Socket;
import java.nio.charset.StandardCharsets;
import java.security.SecureRandom;
import java.util.Base64;
import java.util.Scanner;
import java.util.logging.Logger;

public class OneTimePad {
    private static final Logger logger = Logger.getLogger(OneTimePad.class.getName());
    private static final SecureRandom rand = new SecureRandom();

    public static byte[] generateRandomKey(int len) {
        byte[] key = new byte[len];
        rand.nextBytes(key);
        return key;
    }

    public static byte[] xorCipher(byte[] message, byte[] key) {
        byte[] res = new byte[message.length];
        for (int i = 0; i < message.length; i++) {
            res[i] = (byte) (message[i] ^ key[i]);
        }
        return res;
    }

    public static byte[] generateSecretKey(byte[] sharedSecret, int len) {
        try {
            byte[] key = new byte[len];
            int generated = 0;
            int counter = 0;
            byte[] currentState = sharedSecret;

            while (generated < len) {
                MessageDigest md = MessageDigest.getInstance("SHA-256");
                md.update(currentState);
                md.update((byte) counter);
                byte[] digest = md.digest();
                int toCopy = Math.min(digest.length, len - generated);
                System.arraycopy(digest, 0, key, generated, toCopy);
                generated += toCopy;
                currentState = digest;
                counter++;
            }

            return key;
        } catch (Exception e) {
            byte[] fallback = new byte[len];
            rand.nextBytes(fallback);
            return fallback;
        }
    }

    public static void main(String[] args) {
        Scanner scan = new Scanner(System.in);
        String message = scan.nextLine();
        byte[] key = generateRandomKey(message.getBytes().length);
        byte[] encrypted = xorCipher(message.getBytes(), key);
        byte[] decrypted = xorCipher(encrypted, key);
        if (logger.isLoggable(java.util.logging.Level.INFO)) {
            logger.info(String.format("Message - { %s }%nEncrypted - { %s }%n Decrypted - { %s }", message,
                    new String(encrypted),
                    new String(decrypted)));
        }
        scan.close();
    }
}

package routybor.otp.Messenger;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.io.PrintWriter;
import java.math.BigInteger;
import java.net.ServerSocket;
import java.net.Socket;
import java.nio.charset.StandardCharsets;
import java.security.SecureRandom;
import java.util.Base64;
import java.util.logging.Logger;

public class Server {

    private static final Logger logger = Logger.getLogger(Server.class.getName());
    private static final int PORT = 5000;
    private static final SecureRandom rand = new SecureRandom();

    public static void startServer(int port, MessengerFrame frame) {
        try (ServerSocket serverSocket = new ServerSocket(port)) {
            boolean keepRunning = true;
            while (keepRunning && !serverSocket.isClosed()) {
                logger.info("Waiting for connection...");
                Socket socket = serverSocket.accept();
                if (logger.isLoggable(java.util.logging.Level.INFO)) {
                    logger.info(String.format("Client connected - %s%n", socket.getRemoteSocketAddress()));
                }
                keepRunning = handleClient(socket, frame);
            }
        } catch (IOException e) {
            logger.severe(e.getMessage());
        }
    }

    private static boolean handleClient(Socket socket, MessengerFrame frame) {
        try {
            InputStream input = socket.getInputStream();
            BufferedReader reader = new BufferedReader(new InputStreamReader(input));
            OutputStream out = socket.getOutputStream();
            PrintWriter writer = new PrintWriter(out, true);
            byte[] shared = difHelHandshake(reader, writer);
            if (shared == null || shared.length == 0) {
                closeResources(reader, writer, socket);
                return false;
            }

            boolean keepRunning = receiveLoop(reader, shared, socket, frame);

            closeResources(reader, writer, socket);
            return keepRunning;
        } catch (IOException e) {
            logger.warning(e.getMessage());
            closeSocket(socket);
            return false;
        }
    }

    private static boolean processMessage(String encryptedB64, byte[] shared, String ip, MessengerFrame frame) {
        try {
            byte[] encryptedMessage = Base64.getDecoder().decode(encryptedB64);
            byte[] key = OneTimePad.generateSecretKey(shared, encryptedMessage.length);
            byte[] decrypted = OneTimePad.xorCipher(encryptedMessage, key);
            String message = new String(decrypted, StandardCharsets.UTF_8);
            if (logger.isLoggable(java.util.logging.Level.INFO)) {
                logger.info(String.format("Received message { %s } from { %s }", message, ip));
            }
            frame.onMessageReceived(message, ip);
            if ("exit".equalsIgnoreCase(message.trim())) {
                logger.info("Shutting down server...");
                return false;
            }
        } catch (IllegalArgumentException iae) {
            logger.warning(iae.getMessage());
        }
        return true;
    }

    private static byte[] difHelHandshake(BufferedReader reader, PrintWriter writer) throws IOException {
        BigInteger p = BigInteger.probablePrime(2048, rand);
        BigInteger g = BigInteger.valueOf(5);

        BigInteger a = new BigInteger(2048, rand).mod(p.subtract(BigInteger.TWO)).add(BigInteger.TWO);
        BigInteger A = g.modPow(a, p);

        if (logger.isLoggable(java.util.logging.Level.INFO)) {
            logger.info(String.format("p = %d%n g = %d%n a = %d%n A = %d%n", p, g, a, A));
        }

        writer.println(p.toString());
        writer.println(g.toString());
        writer.println(A.toString());

        String clientPubLine = reader.readLine();
        if (clientPubLine == null) {
            logger.warning("Client closed before sending public value");
            return new byte[0];
        }
        BigInteger B = new BigInteger(clientPubLine);

        BigInteger shared = B.modPow(a, p);
        return shared.toByteArray();
    }

    private static boolean receiveLoop(BufferedReader reader, byte[] shared, Socket socket, MessengerFrame frame) throws IOException {
        String encryptedB64;
        String ip = socket.getRemoteSocketAddress().toString().split(":")[0].replace("/", ""); // Extract IP
        while ((encryptedB64 = reader.readLine()) != null) {
            boolean keepRunning = processMessage(encryptedB64, shared, ip, frame);
            if (!keepRunning) {
                return false;
            }
        }
        if (logger.isLoggable(java.util.logging.Level.INFO)) {
            logger.info(String.format("Client disconnected - %s. Shutting down server.", ip));
        }
        return false;
    }

    private static void closeResources(BufferedReader reader, PrintWriter writer, Socket socket) {
        try (writer) {
            try {
                reader.close();
            } catch (IOException ignore) {
                // doesn't matter
            }
        }
        closeSocket(socket);
    }

    private static void closeSocket(Socket socket) {
        try {
            socket.close();
        } catch (IOException ignore) {
            // doesn't matter
        }
    }
}

package routybor.otp.Messenger;

import java.io.BufferedReader;
import java.io.IOException;
import java.io.InputStream;
import java.io.InputStreamReader;
import java.io.OutputStream;
import java.io.PrintWriter;
import java.math.BigInteger;
import java.net.Socket;
import java.nio.charset.StandardCharsets;
import java.security.SecureRandom;
import java.util.Base64;
import java.util.Scanner;
import java.util.logging.Logger;

public class Client {

    private static final Logger logger = Logger.getLogger(Client.class.getName());
    private static final SecureRandom rand = new SecureRandom();

    public static void startClient(String serverAddress, int serverPort) {
        Scanner scan = new Scanner(System.in);
        try (Socket socket = new Socket(serverAddress, serverPort)) {
            InputStream input = socket.getInputStream();
            BufferedReader reader = new BufferedReader(new InputStreamReader(input));
            OutputStream output = socket.getOutputStream();
            PrintWriter writer = new PrintWriter(output, true);
            byte[] shared = difHelHandshake(reader, writer);
            if (shared == null) {
                return;
            }

            sendLoop(scan, writer, shared);

        } catch (IOException e) {
            logger.severe(e.toString());
        }
        scan.close();
    }

    private static byte[] difHelHandshake(BufferedReader reader, PrintWriter writer) throws IOException {
        String pLine = reader.readLine();
        String gLine = reader.readLine();
        String aLine = reader.readLine();
        if (pLine == null || gLine == null || aLine == null) {
            logger.severe("Failed to receive DH parameters from server");
            return new byte[0];
        }

        BigInteger p = new BigInteger(pLine);
        BigInteger g = new BigInteger(gLine);
        BigInteger A = new BigInteger(aLine);

        BigInteger b = new BigInteger(2048, rand).mod(p.subtract(BigInteger.TWO)).add(BigInteger.TWO);
        BigInteger B = g.modPow(b, p);

        if (logger.isLoggable(java.util.logging.Level.INFO)) {
            logger.info(String.format("p = %d%n g = %d%n A = %d%n b = %d%n B = %d%n", p, g, A, b, B));
        }

        writer.println(B.toString());

        BigInteger shared = A.modPow(b, p);
        return shared.toByteArray();
    }

    private static void sendLoop(Scanner scan, PrintWriter writer, byte[] shared) {
        boolean running = true;
        while (running && scan.hasNextLine()) {
            String message = scan.nextLine();
            if (message != null) {
                sendMessage(shared, writer, message);
                if (message.equalsIgnoreCase("exit")) {
                    running = false;
                }
            }
        }
    }

    private static void sendMessage(byte[] shared, PrintWriter writer, String message) {
        byte[] bytesMessage = message.getBytes(StandardCharsets.UTF_8);
        byte[] key = OneTimePad.generateSecretKey(shared, bytesMessage.length);
        byte[] encryptedMessage = OneTimePad.xorCipher(bytesMessage, key);
        String encryptedB64 = Base64.getEncoder().encodeToString(encryptedMessage);
        writer.println(encryptedB64);
    }

    /**
     * Lightweight connection wrapper that allows sending encrypted messages and closing.
     */
    public static class Connection {
        private final Socket socket;
        private final PrintWriter writer;
        private final byte[] shared;

        Connection(Socket socket, PrintWriter writer, byte[] shared) {
            this.socket = socket;
            this.writer = writer;
            this.shared = shared;
        }

        public void send(String message) {
            if (socket.isClosed()) return;
            byte[] bytesMessage = message.getBytes(StandardCharsets.UTF_8);
            byte[] key = OneTimePad.generateSecretKey(shared, bytesMessage.length);
            byte[] encryptedMessage = OneTimePad.xorCipher(bytesMessage, key);
            String encryptedB64 = Base64.getEncoder().encodeToString(encryptedMessage);
            writer.println(encryptedB64);
        }

        public void close() {
            try {
                socket.close();
            } catch (IOException e) {
                logger.warning("Failed to close socket: " + e.getMessage());
            }
        }
    }

    /**
     * Connects to a server, runs DH handshake, then listens for incoming Base64-encrypted lines.
     * For each decrypted line, onMessage.accept(plaintext) is invoked.
     * Returns a Connection object that can be used to send messages or close the socket.
     */
    public static Connection connectAndListen(String serverAddress, int serverPort, java.util.function.Consumer<String> onMessage) throws IOException {
        Socket socket = new Socket(serverAddress, serverPort);
        InputStream input = socket.getInputStream();
        BufferedReader reader = new BufferedReader(new InputStreamReader(input));
        OutputStream output = socket.getOutputStream();
        PrintWriter writer = new PrintWriter(output, true);

        byte[] shared = difHelHandshake(reader, writer);
        if (shared == null || shared.length == 0) {
            socket.close();
            throw new IOException("DH handshake failed");
        }

        Connection conn = new Connection(socket, writer, shared);

        Thread readerThread = new Thread(() -> {
            try {
                String line;
                java.util.Base64.Decoder decoder = Base64.getDecoder();
                while ((line = reader.readLine()) != null) {
                    try {
                        byte[] encrypted = decoder.decode(line);
                        byte[] key = OneTimePad.generateSecretKey(shared, encrypted.length);
                        byte[] decrypted = OneTimePad.xorCipher(encrypted, key);
                        String msg = new String(decrypted, StandardCharsets.UTF_8);
                        try {
                            onMessage.accept(msg);
                        } catch (Exception ex) {
                            logger.warning("onMessage callback threw: " + ex.getMessage());
                        }
                    } catch (IllegalArgumentException iae) {
                        logger.warning("Received non-base64 line or decode error: " + iae.getMessage());
                    }
                }
            } catch (IOException e) {
                logger.info("Connection closed: " + e.getMessage());
            } finally {
                try { socket.close(); } catch (IOException ignored) {}
            }
        }, "ClientReaderThread-" + serverAddress + ":" + serverPort);

        readerThread.setDaemon(true);
        readerThread.start();

        return conn;
    }
}